<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ink & Soul - Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #f7f1e3;
            color: #211a15;
        }

        header {
            padding: 25px 7%;
            border-bottom: 1px solid #d5c8b2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        button {
            padding: 11px 20px;
            border: 1px solid #211a15;
            background: transparent;
            cursor: pointer;
            font-family: Georgia, serif;
        }

        button:hover {
            background: #211a15;
            color: white;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 25px;
        }

        .box {
            background: #fffaf0;
            border: 1px solid #d5c8b2;
            padding: 30px;
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 0;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            margin-bottom: 18px;
            border: 1px solid #c8bba5;
            background: #fffdf7;
            font-family: Georgia, serif;
            font-size: 16px;
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        label {
            font-weight: bold;
        }

        .writing {
            border-top: 1px solid #d5c8b2;
            padding: 20px 0;
        }

        .writing:first-child {
            border-top: none;
        }

        .writing h3 {
            margin-bottom: 5px;
        }

        .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .delete {
            border-color: #8b3333;
            color: #8b3333;
        }

        .delete:hover {
            background: #8b3333;
            color: white;
        }

        #dashboard {
            display: none;
        }

        #login {
            max-width: 450px;
            margin: 100px auto;
            padding: 30px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .logout {
            border-color: #8b3333;
            color: #8b3333;
        }

        .logout:hover {
            background: #8b3333;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Ink & Soul</h1>

    <button id="logoutBtn" class="logout" style="display:none;">
        Log Out
    </button>
</header>


<!-- LOGIN -->
<div id="login" class="box">

    <h2>Admin Login</h2>

    <p>Sign in to manage Ink & Soul.</p>

    <label>Email</label>
    <input
        type="email"
        id="email"
        placeholder="Your email"
    >

    <label>Password</label>
    <input
        type="password"
        id="password"
        placeholder="Your password"
    >

    <button id="loginBtn">
        Login
    </button>

    <div id="loginMessage"></div>

</div>


<!-- DASHBOARD -->
<div id="dashboard">

    <div class="container">

        <div class="box">

            <h2 id="formTitle">Add New Writing</h2>

            <label>Title</label>
            <input
                type="text"
                id="title"
                placeholder="Writing title"
            >

            <label>Type</label>
            <select id="type">
                <option value="Poem">Poem</option>
                <option value="Story">Story</option>
                <option value="Letter">Letter</option>
                <option value="Prose">Prose</option>
            </select>

            <label>Short Description</label>
            <input
                type="text"
                id="excerpt"
                placeholder="A short description"
            >

            <label>Writing</label>
            <textarea
                id="content"
                placeholder="Write your poem, story or letter here..."
            ></textarea>

            <label>
                <input
                    type="checkbox"
                    id="published"
                    checked
                    style="width:auto;"
                >
                Published
            </label>

            <br><br>

            <button id="saveBtn">
                Publish Writing
            </button>

            <button id="cancelBtn" style="display:none;">
                Cancel Edit
            </button>

            <div id="formMessage"></div>

        </div>


        <div class="box">

            <h2>My Writings</h2>

            <div id="writingsList">
                Loading...
            </div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://egphlummrypugxilvygw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_7lPUyq5uDyB71s2Ie4vS-g_PCZLaoFc";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let editingId = null;


// -------------------------
// LOGIN
// -------------------------

document
    .getElementById("loginBtn")
    .addEventListener("click", login);


async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    message.textContent = "Logging in...";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        message.textContent =
            "Login failed: " + error.message;

        return;
    }

    message.textContent = "";

    showDashboard();
}


// -------------------------
// CHECK LOGIN
// -------------------------

async function checkUser() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {

        showDashboard();

    } else {

        showLogin();
    }
}


// -------------------------
// SHOW LOGIN
// -------------------------

function showLogin() {

    document.getElementById("login").style.display =
        "block";

    document.getElementById("dashboard").style.display =
        "none";

    document.getElementById("logoutBtn").style.display =
        "none";
}


// -------------------------
// SHOW DASHBOARD
// -------------------------

function showDashboard() {

    document.getElementById("login").style.display =
        "none";

    document.getElementById("dashboard").style.display =
        "block";

    document.getElementById("logoutBtn").style.display =
        "block";

    loadWritings();
}


// -------------------------
// LOG OUT
// -------------------------

document
    .getElementById("logoutBtn")
    .addEventListener("click", async function () {

        await supabaseClient.auth.signOut();

        showLogin();

    });


// -------------------------
// SAVE WRITING
// -------------------------

document
    .getElementById("saveBtn")
    .addEventListener("click", saveWriting);


async function saveWriting() {

    const title =
        document.getElementById("title").value.trim();

    const type =
        document.getElementById("type").value;

    const excerpt =
        document.getElementById("excerpt").value.trim();

    const content =
        document.getElementById("content").value.trim();

    const published =
        document.getElementById("published").checked;

    const message =
        document.getElementById("formMessage");


    if (!title || !content) {

        message.textContent =
            "Please enter a title and writing.";

        return;
    }


    message.textContent = "Saving...";


    if (editingId) {

        const { error } =
            await supabaseClient
                .from("writings")
                .update({
                    title: title,
                    type: type,
                    excerpt: excerpt,
                    content: content,
                    published: published
                })
                .eq("id", editingId);


        if (error) {

            message.textContent =
                "Error: " + error.message;

            return;
        }


        message.textContent =
            "Writing updated successfully!";

    } else {

        const { error } =
            await supabaseClient
                .from("writings")
                .insert({
                    title: title,
                    type: type,
                    excerpt: excerpt,
                    content: content,
                    published: published
                });


        if (error) {

            message.textContent =
                "Error: " + error.message;

            return;
        }


        message.textContent =
            "Writing published successfully!";
    }


    clearForm();

    loadWritings();
}


// -------------------------
// LOAD WRITINGS
// -------------------------

async function loadWritings() {

    const list =
        document.getElementById("writingsList");

    list.innerHTML = "Loading...";


    const { data, error } =
        await supabaseClient
            .from("writings")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        list.innerHTML =
            "Error loading writings: " +
            error.message;

        return;
    }


    if (!data || data.length === 0) {

        list.innerHTML =
            "<p>You have no writings yet.</p>";

        return;
    }


    list.innerHTML = "";


    data.forEach(function (writing) {

        const div =
            document.createElement("div");

        div.className = "writing";


        const title =
            document.createElement("h3");

        title.textContent =
            writing.title;


        const info =
            document.createElement("p");

        info.textContent =
            writing.type +
            " • " +
            (writing.published
                ? "Published"
                : "Draft");


        const excerpt =
            document.createElement("p");

        excerpt.textContent =
            writing.excerpt || "";


        const actions =
            document.createElement("div");

        actions.className = "actions";


        const editButton =
            document.createElement("button");

        editButton.textContent = "Edit";

        editButton.onclick =
            function () {

                editWriting(writing);
            };


        const deleteButton =
            document.createElement("button");

        deleteButton.textContent = "Delete";

        deleteButton.className = "delete";

        deleteButton.onclick =
            function () {

                deleteWriting(writing.id);
            };


        actions.appendChild(editButton);

        actions.appendChild(deleteButton);


        div.appendChild(title);

        div.appendChild(info);

        div.appendChild(excerpt);

        div.appendChild(actions);


        list.appendChild(div);

    });
}


// -------------------------
// EDIT
// -------------------------

function editWriting(writing) {

    editingId = writing.id;


    document.getElementById("title").value =
        writing.title || "";

    document.getElementById("type").value =
        writing.type || "Poem";

    document.getElementById("excerpt").value =
        writing.excerpt || "";

    document.getElementById("content").value =
        writing.content || "";

    document.getElementById("published").checked =
        writing.published;


    document.getElementById("formTitle").textContent =
        "Edit Writing";

    document.getElementById("saveBtn").textContent =
        "Save Changes";

    document.getElementById("cancelBtn").style.display =
        "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


// -------------------------
// DELETE
// -------------------------

async function deleteWriting(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this writing?"
        );


    if (!confirmed) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("writings")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "Could not delete writing: " +
            error.message
        );

        return;
    }


    loadWritings();
}


// -------------------------
// CANCEL EDIT
// -------------------------

document
    .getElementById("cancelBtn")
    .addEventListener("click", clearForm);


function clearForm() {

    editingId = null;


    document.getElementById("title").value = "";

    document.getElementById("type").value =
        "Poem";

    document.getElementById("excerpt").value = "";

    document.getElementById("content").value = "";

    document.getElementById("published").checked =
        true;


    document.getElementById("formTitle").textContent =
        "Add New Writing";

    document.getElementById("saveBtn").textContent =
        "Publish Writing";

    document.getElementById("cancelBtn").style.display =
        "none";
}


// START
checkUser();

</script>

</body>
</html>
