<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact — Ink & Soul</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">

    <a class="brand" href="index.html">
      <span class="brand-mark">✒</span>
      <span>Ink &amp; Soul</span>
    </a>

    <button class="menu-toggle" aria-label="Open menu">
      ☰
    </button>

    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="library.html">Library</a>
      <a href="about.html">About</a>
      <a class="active" href="contact.html">Contact</a>
    </nav>

  </header>


  <main class="page narrow">

    <div class="eyebrow">
      <span></span>
      CONTACT
      <span></span>
    </div>

    <h1>Let's keep the conversation going.</h1>

    <p class="page-intro">
      Have something to say? I'd love to hear from you.
    </p>


    <!-- CONTACT FORM -->

    <form
      class="contact-form"
      action="https://formspree.io/f/xppalnez"
      method="POST"
    >

      <label>
        Name

        <input
          type="text"
          name="name"
          placeholder="Your name"
          required
        >

      </label>


      <label>
        Email

        <input
          type="email"
          name="email"
          placeholder="your@email.com"
          required
        >

      </label>


      <label>
        Message

        <textarea
          name="message"
          rows="7"
          placeholder="Write your message..."
          required
        ></textarea>

      </label>


      <button
        class="button"
        type="submit"
      >
        Send Message
      </button>

    </form>

  </main>


  <footer>
    © <span class="year"></span> Ink &amp; Soul
  </footer>


  <script src="script.js"></script>

</body>
</html>
