<script>

const SUPABASE_URL =
    "https://egphlummrypugxilvygw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_7lPUyq5uDyB71s2Ie4vS-g_PCZLaoFc";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let allWritings = [];

let currentFilter = "all";

let currentSearch = "";


/* =========================
   LOAD LIBRARY
========================= */

async function loadLibrary() {

    const library =
        document.getElementById("library");

    const status =
        document.getElementById("libraryStatus");


    status.textContent =
        "Loading writings...";


    const { data, error } =
        await supabaseClient
            .from("writings")
            .select("id, title, type, excerpt, content")
            .eq("published", true)
            .order("created_at", {
                ascending: false
            });


    if (error) {

        library.innerHTML =
            "<p>Sorry, the library could not be loaded.</p>";

        status.textContent =
            "Unable to load the library.";

        console.error(error);

        return;
    }


    allWritings =
        data || [];


    if (allWritings.length === 0) {

        library.innerHTML =
            "<p>No writings have been published yet.</p>";

        status.textContent =
            "The library is currently empty.";

        return;
    }


    renderLibrary();

}


/* =========================
   DISPLAY WRITINGS
========================= */

function renderLibrary() {

    const library =
        document.getElementById("library");

    const status =
        document.getElementById("libraryStatus");


    library.innerHTML = "";


    const filtered =
        allWritings.filter(function(writing) {

            const type =
                String(writing.type || "")
                    .toLowerCase();

            const title =
                String(writing.title || "")
                    .toLowerCase();

            const excerpt =
                String(writing.excerpt || "")
                    .toLowerCase();

            const content =
                String(writing.content || "")
                    .toLowerCase();


            const matchesFilter =
                currentFilter === "all" ||
                type === currentFilter ||
                type.includes(currentFilter);


            const matchesSearch =
                currentSearch === "" ||
                title.includes(currentSearch) ||
                excerpt.includes(currentSearch) ||
                content.includes(currentSearch);


            return matchesFilter &&
                   matchesSearch;

        });


    status.textContent =
        filtered.length +
        (filtered.length === 1
            ? " writing"
            : " writings") +
        " found";


    if (filtered.length === 0) {

        library.innerHTML = `
            <div class="no-results">
                <h2>Nothing found.</h2>
                <p>
                    Try another search or choose a different category.
                </p>
            </div>
        `;

        return;
    }


    filtered.forEach(function(writing) {

        const article =
            document.createElement("article");

        article.className =
            "writing-card";


        const type =
            document.createElement("div");

        type.className =
            "writing-type";

        type.textContent =
            writing.type || "Writing";


        const title =
            document.createElement("h2");

        title.textContent =
            writing.title;


        const excerpt =
            document.createElement("p");

        excerpt.textContent =
            writing.excerpt ||
            createExcerpt(writing.content);


        const readMore =
            document.createElement("button");

        readMore.className =
            "read-button";

        readMore.textContent =
            "Read more →";


        readMore.addEventListener(
            "click",
            function() {

                showWriting(writing);

            }
        );


        article.appendChild(type);

        article.appendChild(title);

        article.appendChild(excerpt);

        article.appendChild(readMore);


        library.appendChild(article);

    });

}


/* =========================
   CREATE EXCERPT
========================= */

function createExcerpt(content) {

    if (!content) {
        return "";
    }


    const text =
        String(content)
            .replace(/\s+/g, " ")
            .trim();


    if (text.length <= 180) {
        return text;
    }


    return text.substring(0, 180) + "...";

}


/* =========================
   OPEN WRITING
========================= */

function showWriting(writing) {

    const library =
        document.getElementById("library");


    const status =
        document.getElementById("libraryStatus");


    status.textContent =
        "Reading";


    library.innerHTML = "";


    const reader =
        document.createElement("div");

    reader.className =
        "reader";


    const back =
        document.createElement("button");

    back.className =
        "back-button";

    back.textContent =
        "← Back to Library";


    back.addEventListener(
        "click",
        function() {

            status.textContent =
                "Showing your library";

            renderLibrary();

        }
    );


    const type =
        document.createElement("div");

    type.className =
        "writing-type";

    type.textContent =
        writing.type || "Writing";


    const title =
        document.createElement("h1");

    title.className =
        "reader-title";

    title.textContent =
        writing.title;


    const content =
        document.createElement("div");

    content.className =
        "writing-content";

    content.style.whiteSpace =
        "pre-wrap";

    content.textContent =
        writing.content || "";


    reader.appendChild(back);

    reader.appendChild(type);

    reader.appendChild(title);

    reader.appendChild(content);


    library.appendChild(reader);


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   SEARCH
========================= */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        function(event) {

            currentSearch =
                event.target.value
                    .toLowerCase()
                    .trim();


            renderLibrary();

        }
    );


/* =========================
   FILTERS
========================= */

document
    .querySelectorAll(".filter-btn")
    .forEach(function(button) {

        button.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll(".filter-btn")
                    .forEach(function(btn) {

                        btn.classList.remove("active");

                    });


                button.classList.add("active");


                currentFilter =
                    button.dataset.filter;


                renderLibrary();

            }
        );

    });


/* =========================
   START
========================= */

loadLibrary();

</script>


<script src="script.js"></script>

</body>
